<!doctype html>
<!-- Imagem de compartilhamento (Open Graph / Twitter), 1200×630. Renderizar com scripts/og/render.sh → public/og.png -->
<html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chivo+Mono:wght@400;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#080A08;color:#F2F5F0;font-family:Barlow,system-ui,sans-serif}
  body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 70px,rgba(0,230,118,.045) 70px 140px)}
  body::after{content:'';position:absolute;left:50%;top:40%;width:1400px;height:900px;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(0,230,118,.14),rgba(0,230,118,0))}
  .wrap{position:relative;z-index:1;height:100%;padding:56px 64px 48px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #243020;padding-bottom:22px}
  .brand{font-family:Anton,Impact,sans-serif;font-size:44px;text-transform:uppercase;line-height:1;letter-spacing:.01em}
  .brand span{color:#FFD100}.brand em{font-style:normal;font-family:'Chivo Mono',monospace;font-weight:700;font-size:26px;color:#00E676;margin-left:10px;vertical-align:4px}
  .kicker{font-family:'Chivo Mono',monospace;font-size:20px;letter-spacing:.22em;color:#00E676;text-transform:uppercase}
  h1{font-family:Anton,Impact,sans-serif;font-size:104px;line-height:1.06;margin-top:6px;text-transform:uppercase;letter-spacing:.005em}
  h1 .hl{color:#FFD100}
  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
  .lead{font-size:27px;line-height:1.3;color:#B9C4B2;max-width:720px}
  .lead b{color:#F2F5F0;font-weight:600}
  .url{font-family:'Chivo Mono',monospace;font-weight:700;font-size:26px;color:#080A08;background:#FFD100;padding:14px 22px;border-radius:4px;white-space:nowrap}
</style></head>
<body><div class="wrap">
  <div class="top"><div class="brand">Meu Time <span>Político</span><em>2026</em></div><div class="kicker">Brasil · 27 estados · 4 de outubro</div></div>
  <h1>Você escala 6.<br><span class="hl">Quantos jogam<br>contra você?</span></h1>
  <div class="foot">
    <p class="lead">Presidente, governador, dois senadores e deputados como um <b>time</b>. Eles jogam junto? <b>Têm cadeira pra aprovar alguma coisa?</b> Voto nominal e bancada real, sem cadastro.</p>
    <div class="url">meutimepolitico.com</div>
  </div>
</div></body></html>
