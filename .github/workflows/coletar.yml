# Coletores do feed: imprensa de hora em hora (os RSS cobrem 1 a 2 dias); Câmara, Senado, agenda do presidente e pauta
# do plenário a cada 3 horas; a newsletter da semana toda sexta às 12h UTC (9h em Brasília).
# Escrevem no Supabase com a chave secreta, que fica em Settings → Secrets → Actions → SUPABASE_SECRET_KEY.
# Sem o secret o job só avisa e sai, pra não mandar e-mail de falha toda hora.
name: coletar
on:
  schedule:
    - cron: '7 * * * *'       # imprensa
    - cron: '37 */3 * * *'    # Câmara, Senado, agenda do presidente e pauta
    - cron: '0 12 * * 5'      # newsletter da semana
  workflow_dispatch:
    inputs:
      dias: { description: 'Janela da Câmara/Senado, em dias', default: '3' }
concurrency: { group: coletar, cancel-in-progress: false }
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - if: env.SUPABASE_SECRET_KEY == ''
        run: echo "::warning::Falta o secret SUPABASE_SECRET_KEY; nada foi coletado."
      - if: env.SUPABASE_SECRET_KEY != ''
        uses: actions/checkout@v5
      - if: env.SUPABASE_SECRET_KEY != ''
        uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - if: env.SUPABASE_SECRET_KEY != ''
        run: npm ci --no-audit --no-fund
      - if: env.SUPABASE_SECRET_KEY != ''
        run: npm run coletar:imprensa
      - if: env.SUPABASE_SECRET_KEY != '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '37 */3 * * *')
        run: |
          npm run coletar:camara -- --dias=${{ inputs.dias || '2' }}
          npm run coletar:senado -- --dias=${{ inputs.dias || '3' }}
          npm run coletar:presidente -- --dias=2
          npm run coletar:pauta
      - if: env.SUPABASE_SECRET_KEY != '' && github.event.schedule == '0 12 * * 5'
        run: npm run coletar:pauta && npm run newsletter
