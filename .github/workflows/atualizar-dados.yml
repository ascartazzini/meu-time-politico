# Reatualiza bancadas e votos nominais (Câmara/Senado) toda segunda e abre PR se mudou.
name: atualizar-dados
on:
  schedule: [{ cron: '0 9 * * 1' }]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run fetch:camara && npm run fetch:senado && npm run fetch:tse
      - run: npm run build-data && npm run validate-data
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'dados: TSE, bancadas e votos nominais atualizados'
          title: 'Atualização semanal de dados (Câmara/Senado)'
          branch: dados/atualizacao
          add-paths: src/data/generated/*.json
