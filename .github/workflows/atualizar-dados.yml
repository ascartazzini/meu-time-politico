# Reatualiza bancadas e votos nominais (Câmara/Senado) toda segunda e abre PR se mudou.
name: atualizar-dados
on:
  schedule: [{ cron: '0 9 * * 1' }]
  workflow_dispatch:
# O padrão do repositório é só leitura; o create-pull-request precisa empurrar o branch e abrir o PR.
# Também exige Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
permissions:
  contents: write
  pull-requests: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run fetch:camara && npm run fetch:senado && npm run fetch:tse
      # gastos de campanha (prestação de contas, ~370 MB): se o CDN do TSE barrar o runner, segue com o arquivo versionado
      - run: npm run fetch:campanha
        continue-on-error: true
      - run: npm run build-data && npm run validate-data
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'dados: TSE, gastos de campanha, bancadas e votos nominais atualizados'
          title: 'Atualização semanal de dados (Câmara/Senado)'
          branch: dados/atualizacao
          add-paths: src/data/generated/*.json
