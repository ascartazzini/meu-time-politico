# Newsletter da semana: sexta de manhã monta a edição (página /semana/ + HTML) e manda por e-mail pelo Resend.
# Sábado e domingo são rodadas de reserva: montam a edição se a de sexta não rodou (o GitHub às vezes pula
# horário agendado) e mandam pra quem a cota do dia não alcançou. Quem já recebeu não recebe de novo (`envios`).
# Minuto quebrado de propósito: horário cheio é o que o GitHub mais atrasa ou pula.
# Secrets: SUPABASE_SECRET_KEY e RESEND_API_KEY (sem esta, monta a edição e avisa que não enviou).
# Rodar à mão: Actions → newsletter → Run workflow (refaz a edição da semana e manda pra quem falta).
# Com "para" preenchido, só manda uma cópia de teste da última edição pra esse e-mail: não monta nada nem toca na lista.
name: newsletter
on:
  schedule:
    - cron: '41 11 * * 5'     # sexta, 8h41 em Brasília
    - cron: '41 11 * * 6,0'   # reserva
  workflow_dispatch:
    inputs:
      para: { description: 'Teste: mandar só uma cópia pra este e-mail (vazio = envio normal)', default: '' }
concurrency: { group: newsletter, cancel-in-progress: false }
jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - if: inputs.para != ''
        run: npm run newsletter:enviar -- "--para=$PARA"
        env: { PARA: '${{ inputs.para }}' }
      - if: inputs.para == '' && github.event.schedule != '41 11 * * 6,0'
        run: npm run coletar:pauta && npm run newsletter
      - if: inputs.para == '' && github.event.schedule == '41 11 * * 6,0'
        run: npm run coletar:pauta && npm run newsletter -- --se-faltar
      - if: inputs.para == ''
        run: npm run newsletter:enviar
