# Endereço canônico: www.meutimepolitico.com. Apex e o subdomínio antigo do Deploya
# redirecionam pra lá (301) preservando caminho e query; o #s= do link de placar fica no navegador.
server {
    listen 3000;
    server_name meutimepolitico.com meu-time-politico.labs.arturscartazzini.com;
    return 301 https://www.meutimepolitico.com$request_uri;
}

server {
    # o proxy reverso da plataforma sempre encaminha para a porta 3000
    listen 3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # atrás do proxy da plataforma: redirecionamentos (/app → /app/) não podem carregar a porta 3000
    port_in_redirect off;
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/xml text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    # assets do Astro têm hash no nome: cache longo
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # datasets por UF (até ~500 KB): cache curto, muda a cada publicação
    location /dados/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # imagem de compartilhamento e ícones: cache de um dia (trocam pouco, mas sem hash no nome)
    location ~* ^/(og\.png|apple-touch-icon\.png|favicon\.svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # sitemap, robots e llms.txt: sempre frescos pro buscador
    location ~* ^/(sitemap.*\.xml|robots\.txt|llms\.txt)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # páginas do Astro ficam em pastas (/app/index.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
